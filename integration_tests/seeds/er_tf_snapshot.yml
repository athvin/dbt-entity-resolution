---
version: 2

seeds:
  - name: er_tf_snapshot
    description: >
      The FROZEN term-frequency snapshot `er_tf_all` reads in `frozen` mode
      (D7a). Minted from Splink's own `compute_tf_table` over the reference
      corpus -- `fixtures/baselines/fake_1000/tf_all.parquet` -- so the values
      are the ORACLE's, not this package's macro checked against itself.


      The package ships ZERO sources (M4b): a consumer names their own snapshot
      through `er_tf_snapshot_relation`, and this seed plays that role here.


      Keyed `(er_model_sha, er_tf_snapshot_id, column_name, value)`. Both key
      prefixes are carried as DATA rather than assumed, because a snapshot
      relation may legitimately hold several generations, and a scored row's
      identity includes the model that produced it (M8).


      1,348 rows across four columns. Each column's `tf` sums to exactly 1.0 --
      section 3.5's non-null denominator, `count(<col>)` and not `count(*)`
      (3.82). Refreshing this is an explicit, dated operation that mints a new
      `er_tf_snapshot_id` and forces a FULL rescore (D7a step 4, G7); it is
      never a side effect of ingest.

    config:
      column_types:
        er_model_sha: varchar
        er_tf_snapshot_id: varchar
        column_name: varchar
        value: varchar
        tf: double

    # 3.55 / section 20.4: derived from the synthetic reference corpus, and says
    # so rather than relying on the scanner's heuristics. At the entry's top
    # level, matching er_fake_1000.yml -- which is where check_pii_heuristics.py
    # reads it from.
    meta:
      synthetic: true

    columns:
      - name: er_model_sha
        description: sha256 of the validated model JSON these frequencies belong to.
      - name: er_tf_snapshot_id
        description: The minting event, so a refresh is reviewable rather than silent.
      - name: column_name
        description: Which comparison's distribution this row belongs to.
      - name: value
        description: The source value, as text.
      - name: tf
        description: Term frequency over the non-null population; sums to 1.0 per column.
