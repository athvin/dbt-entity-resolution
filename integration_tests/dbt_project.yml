---
name: "dbt_er_integration_tests"
version: "0.1.0"
config-version: 2

require-dbt-version: [">=1.10.0", "<3.0.0"]
profile: "dbt_er"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

# ---------------------------------------------------------------------------
# BYTE-IDENTICAL to the package's flags: block.
# `flags:` are read ONLY from the INVOKED project, and CI invokes dbt from
# here -- so the package's block does not apply to this build at all.
# scripts/check_flags_parity.py asserts the two stay identical; without it the
# project that actually runs the tests could be strictly less strict than the
# one that ships.
# ---------------------------------------------------------------------------
flags:
  send_anonymous_usage_stats: false

  warn_error_options:
    error: all
    warn: []
    silence: ["InvalidMacroAnnotation"]

  validate_macro_args: true
  require_generic_test_arguments_property: true
  require_all_warnings_handled_by_warn_error: true
  require_resource_names_without_spaces: true
  require_explicit_package_overrides_for_builtin_materializations: true
  skip_nodes_if_on_run_start_fails: true
  source_freshness_run_project_hooks: true
  state_modified_compare_more_unrendered_values: true

  state_modified_compare_vars: true
  require_unique_project_resource_names: true
  require_ref_searches_node_package_before_root: true
  require_valid_schema_from_generate_schema_name: true
  require_sql_header_in_test_configs: true
  require_corrected_analysis_fqns: true
  require_source_and_semantic_model_names_without_spaces: true
  require_event_names_in_deprecations: true

  allow_jinja_file_extensions: false
  support_custom_ref_kwargs: false
  use_catalogs_v2: false
  latest_version_pointer_enabled_by_default: false

vars:
  # Section 2.0 / M4b: the package ships ZERO sources. A consumer names their
  # own relation, and `integration_tests` plays the consumer -- here, the
  # seeded reference corpus.
  er_input_relation: "{{ ref('er_fake_1000') }}"
  er_input_columns: [unique_id, first_name, surname, dob, city, email, cluster]

  # D7a's frozen snapshot, played here by a seed -- the package ships no
  # sources. Minted from Splink's OWN compute_tf_table over the reference
  # corpus, so `er_tf_all` is checked against the oracle rather than against
  # the macro that produced it.
  er_tf_snapshot_relation: "{{ ref('er_tf_snapshot') }}"
  er_tf_snapshot_id: "fake_1000_v1_20260823"
  er_model_sha: "fc832931150d6d3de60326517dad54e40ed3b4a9a8d4b9e00d137c23dcfff978"
  er_tf_columns: [first_name, surname, city, email]

  # Stage 3's rules, as the sidecar publishes them from the VALIDATED model.
  # These are SQL executed with this project's credentials, so the only version
  # that may appear here is one that cleared the section 1.5 trust boundary.
  # Stage 4's levels, supplied NATIVELY by the consumer rather than through
  # the environment. `sql_condition` is the raw model's and
  # `comparison_vector_value` is SPLINK's (A.2 C2), merged by the sidecar --
  # regenerate with `er_sidecar.py --emit er_comparisons`.
  #
  # A native list, not an env var: sqlfluff and dbt both run with
  # project_dir = ./integration_tests, so this project's own vars: block is
  # a channel both already see. That removes an export from the Makefile and
  # an env: from the workflow, and with them a whole class of the divergence
  # D.0 69 and 89 are both about.
  er_comparisons:
    - output_column_name: first_name
      levels:
        - sql_condition: "\"first_name_l\" IS NULL OR \"first_name_r\" IS NULL"
          comparison_vector_value: -1
        - sql_condition: "\"first_name_l\" = \"first_name_r\""
          comparison_vector_value: 4
        - sql_condition: "jaro_winkler_similarity(\"first_name_l\", \"first_name_r\") >= 0.92"
          comparison_vector_value: 3
        - sql_condition: "jaro_winkler_similarity(\"first_name_l\", \"first_name_r\") >= 0.88"
          comparison_vector_value: 2
        - sql_condition: "jaro_winkler_similarity(\"first_name_l\", \"first_name_r\") >= 0.7"
          comparison_vector_value: 1
        - sql_condition: "ELSE"
          comparison_vector_value: 0
    - output_column_name: surname
      levels:
        - sql_condition: "\"surname_l\" IS NULL OR \"surname_r\" IS NULL"
          comparison_vector_value: -1
        - sql_condition: "\"surname_l\" = \"surname_r\""
          comparison_vector_value: 4
        - sql_condition: "jaro_winkler_similarity(\"surname_l\", \"surname_r\") >= 0.92"
          comparison_vector_value: 3
        - sql_condition: "jaro_winkler_similarity(\"surname_l\", \"surname_r\") >= 0.88"
          comparison_vector_value: 2
        - sql_condition: "jaro_winkler_similarity(\"surname_l\", \"surname_r\") >= 0.7"
          comparison_vector_value: 1
        - sql_condition: "ELSE"
          comparison_vector_value: 0
    - output_column_name: dob
      levels:
        - sql_condition: >-
            try_strptime("dob_l", '%Y-%m-%d') IS NULL OR try_strptime("dob_r", '%Y-%m-%d') IS NULL
          comparison_vector_value: -1
        - sql_condition: "\"dob_l\" = \"dob_r\""
          comparison_vector_value: 5
        - sql_condition: "damerau_levenshtein(\"dob_l\", \"dob_r\") <= 1"
          comparison_vector_value: 4
        - sql_condition: >-
            ABS(EPOCH(try_strptime("dob_l", '%Y-%m-%d')) - EPOCH(try_strptime("dob_r",
            '%Y-%m-%d'))) <= 2629800.0
          comparison_vector_value: 3
        - sql_condition: >-
            ABS(EPOCH(try_strptime("dob_l", '%Y-%m-%d')) - EPOCH(try_strptime("dob_r",
            '%Y-%m-%d'))) <= 31557600.0
          comparison_vector_value: 2
        - sql_condition: >-
            ABS(EPOCH(try_strptime("dob_l", '%Y-%m-%d')) - EPOCH(try_strptime("dob_r",
            '%Y-%m-%d'))) <= 315576000.0
          comparison_vector_value: 1
        - sql_condition: "ELSE"
          comparison_vector_value: 0
    - output_column_name: city
      levels:
        - sql_condition: "\"city_l\" IS NULL OR \"city_r\" IS NULL"
          comparison_vector_value: -1
        - sql_condition: "\"city_l\" = \"city_r\""
          comparison_vector_value: 1
        - sql_condition: "ELSE"
          comparison_vector_value: 0
    - output_column_name: email
      levels:
        - sql_condition: "\"email_l\" IS NULL OR \"email_r\" IS NULL"
          comparison_vector_value: -1
        - sql_condition: "\"email_l\" = \"email_r\""
          comparison_vector_value: 4
        - sql_condition: >-
            NULLIF(regexp_extract("email_l", '^[^@]+', 0), '') = NULLIF(regexp_extract("email_r",
            '^[^@]+', 0), '')
          comparison_vector_value: 3
        - sql_condition: "jaro_winkler_similarity(\"email_l\", \"email_r\") >= 0.88"
          comparison_vector_value: 2
        - sql_condition: >-
            jaro_winkler_similarity(NULLIF(regexp_extract("email_l", '^[^@]+', 0), ''),
            NULLIF(regexp_extract("email_r", '^[^@]+', 0), '')) >= 0.88
          comparison_vector_value: 1
        - sql_condition: "ELSE"
          comparison_vector_value: 0

  er_blocking_rules:
    - 'l."first_name" = r."first_name"'
    - 'l."surname" = r."surname"'
    - 'l."dob" = r."dob"'
    - 'l."email" = r."email"'

  # This project supplies what the package deliberately refuses to default.
  # A threshold is a precision/recall trade against a cost function; here the
  # cost function is "exercise the gates", so three thresholds and one gray
  # band is the useful shape rather than a justified production value.
  er_thresholds:
    - auto_merge: 0.5
    - auto_merge: 0.9
      review_low: 0.7
    - auto_merge: 0.99

# C.1 delta 11. store_failures_as: table lives HERE and not in the package:
# in the package it materialises 500 rows of person data into every consumer's
# warehouse (section 12.5, 3.52).
data_tests:
  dbt_er:
    +severity: error
    +store_failures_as: table
    +schema: er_test_failures
    +limit: 500
