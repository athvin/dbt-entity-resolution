---
version: 2

macros:
  - name: er_tf_divisor_sql
    description: >
      Section 3.2 correction 2: the divisor is `GREATEST(tf_l, tf_r)` expressed
      as a CASE with mutual `coalesce` -- never `LEAST`, never
      `coalesce(tf_l, tf_r)`. Splink deliberately uses the MORE COMMON term's
      frequency, giving the smaller boost, so `LEAST` flips the direction on
      every pair where the two sides differ. That is a systematic divergence,
      not a floating-point one.


      `tf_minimum_u_value` floors the divisor, capping the boost. It is OMITTED
      from the JSON when 0, so it defaults to 0.0 and D1's validation must not
      reject that as an out-of-range probability.

    arguments:
      - name: tf_left
        type: string
        description: The left term-frequency column expression.
      - name: tf_right
        type: string
        description: The right term-frequency column expression.
      - name: tf_minimum_u_value
        type: float
        description: Floor for the divisor. Defaults to 0.0 (i.e. no floor).
