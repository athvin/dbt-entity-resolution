[project]
name = "dbt-er"
version = "0.1.0"
description = "Splink's entity resolution as declarative pure-SQL dbt models on DuckDB"
readme = "README.md"
license = "MIT"
# DbtBestPractices.md section 4: the floor is the intersection of dbt-bouncer
# (>=3.11,<3.15) and dbt-osmosis (>=3.10,<3.14). Everything else needs only 3.10.
requires-python = ">=3.12,<3.14"

# ---------------------------------------------------------------------------
# Runtime. DbtBestPractices.md section 4 pins anything parity-critical to an
# EXACT version, and section 16 puts those on Dependabot's ignore list: a bot
# bumping one silently invalidates every frozen Splink baseline and produces a
# false green.
#
# The exact set is deliberately small. It is the set a consumer installs.
# ---------------------------------------------------------------------------
dependencies = [
    "dbt-core==1.12.2",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
]

[dependency-groups]
# The parity oracle. Not a runtime dependency: section 8 DoD 2 requires the dbt
# run to be free of Splink, and consumer-smoke asserts the published install
# path does not drag it in.
oracle = [
    "splink==4.0.16",
    # Parity-critical and arrives transitively through Splink, which is why G11
    # calls it invisible to a pin list naming only the four.
    #
    # The upper bound is NOT Splink's. splink 4.0.16 asks only for >=17.6.0;
    # dbt-bouncer 3.8.0 requires >=25,<31. So the resolved version is the one a
    # LINT TOOL permits, and a routine dbt-bouncer bump can move a dependency
    # that decides which comparison levels receive a TF adjustment (A.2 C2).
    # Pinned exactly here, and dbt-bouncer joins the ignore list in section 16.
    "sqlglot==30.17.0",
]

lint = [
    # Two-package lockstep: sqlfluff-templater-dbt==4.3.0 hard-pins
    # sqlfluff==4.3.0. Moving one without the other fails resolution outright,
    # so a SQLFluff upgrade is always a two-package bump (section 4).
    "sqlfluff==4.3.0",
    "sqlfluff-templater-dbt==4.3.0",
    "yamllint==1.38.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.14,<3",
    "pre-commit>=4.0",
]

bouncer = [
    "dbt-bouncer==3.8.0",
]

test = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    # 3.57: every enforcement script ships a failing-case test, with a coverage
    # floor. NOT pytest-rerunfailures - section 21 forbids automatic retries,
    # and that is the load-bearing rule.
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["scripts", "dbt_bouncer_checks", "harness", "tests_python"]

[tool.ruff.lint]
# 3.34. `select = ALL` and then argue with individual rules in writing, rather
# than curating an allowlist nobody can audit.
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "D203",    # incompatible with D211; D211 is the one we keep
    "D213",    # incompatible with D212; D212 is the one we keep
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is their whole job.
"tests_python/**" = ["S101", "PLR2004", "INP001"]
"harness/**" = ["S101", "PLR2004", "INP001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "dbt_bouncer_checks", "harness", "tests_python"]
# dbt-bouncer ships no type information; section 6.2 records that its @check
# decorator is untyped under --strict and that a narrow per-line ignore is
# preferable to relaxing disallow_untyped_decorators package-wide.
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests_python", "harness"]
# 3.58: determinism is pinned, not assumed - and asserted in the determinism
# job rather than merely set here.
env = ["PYTHONHASHSEED=0", "TZ=UTC", "LC_ALL=C"]
