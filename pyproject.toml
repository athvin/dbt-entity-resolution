[project]
name = "dbt-er"
version = "0.1.0"
description = "Splink's entity resolution as declarative pure-SQL dbt models on DuckDB"
readme = "README.md"
license = "MIT"
# DbtBestPractices.md section 4: the floor is the intersection of dbt-bouncer
# (>=3.11,<3.15) and dbt-osmosis (>=3.10,<3.14). Everything else needs only 3.10.
requires-python = ">=3.12,<3.14"

# ---------------------------------------------------------------------------
# Runtime. DbtBestPractices.md section 4 pins anything parity-critical to an
# EXACT version, and section 16 puts those on Dependabot's ignore list: a bot
# bumping one silently invalidates every frozen Splink baseline and produces a
# false green.
#
# The exact set is deliberately small. It is the set a consumer installs.
# ---------------------------------------------------------------------------
dependencies = [
    "dbt-core==1.12.2",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
]

[dependency-groups]
# The parity oracle. Not a runtime dependency: section 8 DoD 2 requires the dbt
# run to be free of Splink, and consumer-smoke asserts the published install
# path does not drag it in.
oracle = [
    "splink==4.0.16",
    # Parity-critical and arrives transitively through Splink, which is why G11
    # calls it invisible to a pin list naming only the four.
    #
    # The upper bound is NOT Splink's. splink 4.0.16 asks only for >=17.6.0;
    # dbt-bouncer 3.8.0 requires >=25,<31. So the resolved version is the one a
    # LINT TOOL permits, and a routine dbt-bouncer bump can move a dependency
    # that decides which comparison levels receive a TF adjustment (A.2 C2).
    # Pinned exactly here, and dbt-bouncer joins the ignore list in section 16.
    "sqlglot==30.17.0",
]

lint = [
    # Two-package lockstep: sqlfluff-templater-dbt==4.3.0 hard-pins
    # sqlfluff==4.3.0. Moving one without the other fails resolution outright,
    # so a SQLFluff upgrade is always a two-package bump (section 4).
    "sqlfluff==4.3.0",
    "sqlfluff-templater-dbt==4.3.0",
    "yamllint==1.38.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.14,<3",
    # mypy --strict cannot check a yaml.safe_load call without these, and two
    # enforcement scripts parse YAML.
    "types-PyYAML>=6,<7",
    "pre-commit>=4.0",
]

bouncer = [
    "dbt-bouncer==3.8.0",
]

test = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    # 3.57: every enforcement script ships a failing-case test, with a coverage
    # floor. NOT pytest-rerunfailures - section 21 forbids automatic retries,
    # and that is the load-bearing rule.
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["scripts", "dbt_bouncer_checks", "harness", "tests_python"]

# 3.34's subject is THIS PACKAGE's Python: the enforcement scripts, the custom
# bouncer checks, the harness, and their tests. `.claude/skills/` is operational
# tooling that arrived with the repository and is maintained elsewhere;
# reformatting it would produce a diff against its source with no owner, and
# 3.57's "every script ships a failing-case test" is not a claim anyone made
# about it.
exclude = [
    ".claude",
    # ruff formats Python fenced blocks inside Markdown. The blocks in these
    # documents are QUOTED EVIDENCE -- dbt-duckdb's CONSTRAINT_SUPPORT read from
    # source, section 11.3's constants, C.4's as-executed macro -- and section 0
    # is explicit that a [VERIFIED] block is "reproduced as executed". A
    # formatter silently rewriting one destroys the only thing section 0 says
    # the document must not smooth away. Found when `ruff format` realigned
    # section 8.2's dict.
    "docs/**/*.md",
    "*.md",
]

[tool.ruff.lint]
# 3.34. `select = ALL` and then argue with individual rules in writing, rather
# than curating an allowlist nobody can audit.
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "D203",    # incompatible with D211; D211 is the one we keep
    "D213",    # incompatible with D212; D212 is the one we keep
    # 3.34's instruction is `select = ALL` and then argue with individual rules
    # IN WRITING, rather than curating an allowlist nobody can audit. This is
    # that argument.
    #
    # CPY001 wants a copyright header in every file. The repository has a
    # LICENSE, section 24 governs attribution, and a per-file notice would be a
    # 70-file diff that says nothing the LICENSE does not. Revisit if section 24
    # ever requires per-file notices - it currently does not.
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is their whole job.
#
# D103 (missing docstring) is dropped for tests specifically. A test's NAME is
# its documentation here - `test_pairing_fails_on_a_missing_properties_file`
# says more than a docstring restating it would - and a docstring that restates
# its function name is exactly the decayed-comment problem 3.37 describes,
# multiplied by every test. Tests whose reason is not obvious from the name DO
# carry one; see the section 6.1 blind-spot tests.
"tests_python/**" = ["S101", "PLR2004", "INP001", "D103", "FBT001"]
"harness/**" = ["S101", "PLR2004", "INP001", "D103"]
# PLR0913 on the comparators specifically. Their parameters ARE A.4's tolerance
# table -- key columns, the weight and probability column names, the threshold
# list, the artefact label, the logged-divergence set. Every one is
# keyword-only, and collapsing them into a config object would hide the thing a
# reviewer most needs to see: which gate is being applied to which columns.
"harness/comparators.py" = ["S101", "PLR2004", "INP001", "D103", "PLR0913"]
# ANN401 on gen_baseline.py. Splink 4 ships no type information, so every
# annotation on a Linker, a SettingsCreator or a SplinkDataFrame would be
# `Any` under a different name. Writing `Any` and saying why is more honest
# than importing private types to satisfy a linter.
"scripts/gen_baseline.py" = ["ANN401"]
# ANN401 on er_sidecar.py: sqlglot's `exp` module and its expression nodes are
# passed through untyped, and annotating them would mean importing private
# sqlglot types into a module whose whole point is not to trust its input.
"scripts/er_sidecar.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
# Only directories that CURRENTLY exist are listed, and each is added in the
# same commit as its first file -- the discipline C.1 already applies to its
# `models:` blocks, for the same reason. Naming `harness` and
# `dbt_bouncer_checks` before they existed made mypy resolve two absent trees to
# the same module and fail with "Duplicate module named __main__", which reads
# like a mypy bug and is not one.
files = ["scripts", "tests_python", "harness"]
explicit_package_bases = true
# The tests import the scripts by module name, which is how they are invoked in
# anger (`python scripts/check_yml_pairing.py`). Without this, mypy resolves the
# imports from the repository root and cannot find them.
mypy_path = "scripts"
# dbt-bouncer ships no type information; section 6.2 records that its @check
# decorator is untyped under --strict and that a narrow per-line ignore is
# preferable to relaxing disallow_untyped_decorators package-wide.
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests_python", "harness"]
# 3.58 pins PYTHONHASHSEED / TZ / LC_ALL in the Makefile and the workflow env,
# and the determinism job ASSERTS them. A pytest `env =` block here would need
# the pytest-env plugin, and without it the option is silently unknown -- an
# inert setting that reads like a live one, which is the shape of defect this
# project keeps finding. Set where 3.58 says to set it, asserted where 3.58 says
# to assert it, and not restated here.
