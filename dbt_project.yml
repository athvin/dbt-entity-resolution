---
name: "dbt_er"
version: "0.1.0"
config-version: 2

# Upper bound includes 2.0.0 so the package is not marked incompatible the day a
# major lands. The EXACT runtime version is pinned in uv.lock; this range is the
# compatibility contract offered to consumers.
require-dbt-version: [">=1.10.0", "<3.0.0"]

profile: "dbt_er"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
# NOTE: setting docs-paths REPLACES the default (all resource paths) -- any
# {% docs %} block outside these directories is silently dropped.
docs-paths: ["models", "macros"]
clean-targets: ["target", "dbt_packages"]

# Consumers physically cannot ref() our staging/intermediate internals.
restrict-access: true

# ---------------------------------------------------------------------------
# `flags:` are read ONLY from the INVOKED project. They do NOT reach consumers,
# and do NOT apply when dbt is invoked from integration_tests/. This block MUST
# stay identical to the one there -- scripts/check_flags_parity.py asserts it.
# ---------------------------------------------------------------------------
flags:
  send_anonymous_usage_stats: false

  # V2 syntax. The legacy include:/exclude: form raises WEOIncludeExcludeDeprecation,
  # and with `error: all` that deprecation is itself an error.
  warn_error_options:
    error: all
    warn: []
    # dbt-core #11792 / #12574 are OPEN: validate_macro_args false-positives on
    # custom generic tests. REMOVAL TRIGGER: delete once #11792 ships.
    silence: ["InvalidMacroAnnotation"]

  # --- already true at 1.12.2; pinned so an upstream flip cannot loosen us ---
  validate_macro_args: true
  require_generic_test_arguments_property: true
  require_all_warnings_handled_by_warn_error: true
  require_resource_names_without_spaces: true
  require_explicit_package_overrides_for_builtin_materializations: true
  skip_nodes_if_on_run_start_fails: true
  source_freshness_run_project_hooks: true
  state_modified_compare_more_unrendered_values: true

  # --- default false, flipped ON for maximum strictness ---
  state_modified_compare_vars: true
  require_unique_project_resource_names: true
  require_ref_searches_node_package_before_root: true
  require_valid_schema_from_generate_schema_name: true
  require_sql_header_in_test_configs: true
  require_corrected_analysis_fqns: true
  require_source_and_semantic_model_names_without_spaces: true
  require_event_names_in_deprecations: true

  # --- left false ON PURPOSE: enabling these LOOSENS behaviour ---
  allow_jinja_file_extensions: false
  support_custom_ref_kwargs: false
  use_catalogs_v2: false
  latest_version_pointer_enabled_by_default: false

vars:
  # PRIMARY INGESTION PATH:
  #   export DBT_ER_MODEL_JSON="$(cat fixtures/model_jsons/fake_1000_v1.json)"
  # consumed as fromjson(env_var('DBT_ER_MODEL_JSON')). See section 9 for why
  # env_var and not --vars, and section 1.5 for why an unvalidated JSON has no
  # er_model_sha and therefore does not build.
  er_model: {}

  # Derived where er_model is emitted, NOT by a macro: the schema.yml context has
  # no macros. Consumed as `columns: "{{ var('er_gamma_columns') }}"`.
  er_gamma_columns: []
  er_bf_columns: []
  er_scored_pairs_columns: []
  er_enforce_contracts: true

  # ---- input contract (DesignDoc section 2.0, DR-16) ---------------------
  # A relation EXPRESSION valid in a FROM clause: a qualified name, a view, or
  # read_parquet(...). The package ships zero sources -- a source declared in a
  # package forces its database and schema onto every consumer (M4b).
  #
  # No default. A relation name we invented would resolve to nothing or, worse,
  # to something. The consumer also owns ORDERING: a relation name creates no
  # DAG edge, so nothing here can guarantee the input exists before we read it.
  er_input_relation: ""
  # The declared input column set, as a parse-time var. D1's corollary applied
  # to inputs: every column name is a pure function of the model JSON, derived
  # at parse time, never introspected.
  er_input_columns: []

  # ---- thresholds (DesignDoc section 1.7, DR-08 / DR-09) -----------------
  # C.1 delta 12. A list of {auto_merge, review_low} pairs, NOT a bare list of
  # numbers and NOT a single var. Stage 6's AC needs three thresholds at once,
  # and cross-threshold monotonicity is not expressible as a dbt test when the
  # partitions never coexist in one build.
  #
  # NO DEFAULT, deliberately. [RECON] on the improved fixture model: F1 peaks at
  # 0.9809 at t=0.5 and falls to 0.9219 at t=0.9 -- the value section 8's own DoD
  # used as its example -- costing ~330 true pairs for ZERO precision benefit.
  # A default nobody justified was silently choosing worse output. See 1.8.
  #
  # review_low defaults to auto_merge per pair, making the gray band empty.
  #
  # Routed through the ENVIRONMENT, not just `vars:`, for the same reason
  # er_model is (section 9): sqlfluff has no --vars, so a value reachable only
  # by --vars is a value the linter cannot see. Section 11.1 claimed "a bare
  # `sqlfluff lint` works with no setup" on the strength of the default this
  # var no longer has; the environment is what restores that property without
  # restoring a default nobody justified.
  # It is a JSON *string* here, not a list, and the model parses it. dbt renders
  # a Jinja-bearing vars: value to a STRING, so structure cannot survive this
  # block -- which is the same constraint D1 already works around for the model
  # JSON, generalised. A YAML list supplied directly (as integration_tests/ does)
  # is also accepted; the model handles both.
  er_thresholds: "{{ env_var('DBT_ER_THRESHOLDS', '[]') }}"

  # From measured capacity, NOT Splink's per-rule max_rows_limit of 1e9 -- at the
  # measured 946 B/pair that limit would admit a 946 GB build (Appendix A, B1).
  # C.1 delta 3: this literal is re-derived by Stage 0.6's measurement, which
  # owns it. It is provisional until then.
  # Stage 0.6 / D11 rec 5, RE-DERIVED 2026-08-23 from measurement rather than
  # carried forward. The old value, 42000000, came from a 946 B/pair WIDE shape;
  # section 5 records that it "under-provisions the narrow one by roughly 10x".
  #
  # Measured on DuckDB 1.5.5 (harness/capacity.py, 200k rows), and the units
  # matter more than the shape does:
  #
  #   compressible narrow   17.1 B/pair on disk   104.5 B/pair in memory
  #   high-entropy narrow   53.8 B/pair on disk   151.7 B/pair in memory
  #
  # The published figures are MEMORY figures -- 104.5 reproduces section 5's
  # "measured narrow ~100 B/pair" -- so measuring the obvious way, the size of
  # the database file, over-provisions by about six.
  #
  # er_bytes_per_pair takes the CONSERVATIVE cell: high-entropy, because real
  # names and emails do not compress like `i % 97`, and a guardrail whose
  # failure mode is an OOM should err toward refusing work.
  er_bytes_per_pair: 152
  # Derived: 12 GiB memory_limit (profiles.yml default) x 0.5 / 152 B.
  # The half is because the pair relation is not alone in memory -- the join
  # producing it and its hash tables are there too.
  er_max_pairs: 42384545
  #
  # WORTH STATING PLAINLY: this lands within 1% of the inherited 42000000 -- but
  # for entirely different reasons. The old figure was 40 GB at 946 B/pair
  # (wide); this is 12 GiB at 152 B/pair (narrow, high-entropy). The constant
  # happened to be about right for the shipped configuration and would have been
  # wrong the moment either premise moved. What changed is not the number, it is
  # that the number is now derived from values a reader can check.

  # ---- quality floors (DesignDoc section 1.8, DR-22) ---------------------
  # C.1 delta 13. Committed per fixture, set at Stage 0.4 from the FIXED model,
  # and owned via CODEOWNERS -- a floor anybody can lower to make CI green is
  # not a floor. Empty until Stage 0.4 measures them; Stage 0.4 cannot complete
  # without them.
  # ---------------------------------------------------------------------
  # DR-22 / section 1.8 / A.6 Q5 -- the quality floors, SET FROM MEASUREMENT
  # (Stage 0.4, 2026-08-23). `scripts/measure_quality.py` reproduces every
  # number below from the frozen baselines and fake_1000's ground-truth
  # `cluster` column.
  #
  # Why these exist at all: PARITY IS NOT QUALITY. A reimplementation can match
  # Splink bit-for-bit and still be a bad entity resolver, because every
  # section 6.4 gate compares two engines and none compares either to the truth.
  #
  # Measured on the FIXED, TRAINED model (4 blocking rules) over 2,031 true
  # pairs -- 1,000 records in 251 clusters of size 1-7:
  #
  #   blocking recall            0.8124   (2 rules alone gave 0.5057)
  #   t=0.5    precision 1.0000  recall 0.7046  F1 0.8267
  #   t=0.9    precision 1.0000  recall 0.6283  F1 0.7717
  #   t=0.99   precision 1.0000  recall 0.4850  F1 0.6532
  #   max cluster size 7 at every threshold (the fixture's true max is 7)
  # ---------------------------------------------------------------------

  # TWO-SIDED, per M12 rec 2: failing below is a regression; failing ABOVE means
  # the fixture or the oracle moved rather than the code, and that is equally a
  # finding. The band is measured +/- ~0.03, tight enough to catch drift and
  # loose enough to survive a patch release.
  er_blocking_recall_floor:
    fake_1000:
      min: 0.78
      max: 0.84

  # Per fixture AND per threshold, because F1 varies by 0.17 across the three
  # thresholds Stage 6 builds simultaneously -- a single floor would be either
  # vacuous at t=0.5 or unmeetable at t=0.99. Set ~0.02 below measured.
  er_f1_floor:
    fake_1000:
      "0.5": 0.80
      "0.9": 0.75
      "0.99": 0.63

  # A HARD test, not a warning (M12 rec 3). Cluster-level error amplifies:
  # measured edge precision 0.9764 against CLUSTER precision 0.7495, 14.8x. The
  # value is the fixture's true maximum cluster size, so any over-merge exceeds
  # it immediately -- which is the point.
  er_max_cluster_size:
    fake_1000: 7

  # ---- policy knobs. Raising any of these is a reviewable act -------------
  # NOTE the split (section 2.1, C.1 delta 10, RC48): these are POLICY vars and
  # are meant to be overridable. The HARDENING values --
  # er_allowed_materializations, er_must_carry_constraints and the exemption
  # mapping -- are NOT here. They live in a package-owned macro that root
  # configuration cannot reach, because a consumer setting
  # er_allowed_materializations: ["view"] would render every DDL constraint in
  # the project inert while their build stayed green.
  er_min_model_description_chars: 40
  er_min_column_description_chars: 10

  # ---- observability: OFF by default. A package's on-run-end hook fires in
  # every consumer's project and dbt-core #10592 is still open.
  er_obs_enabled: false
  er_obs_database: "obs"
  er_obs_schema: "er_meta"

models:
  dbt_er:
    # C.1 delta 9: dbt_er_enabled -> er_enabled (section 10.5, 3.33).
    +enabled: "{{ var('er_enabled', true) }}"
    +schema: entity_resolution
    +materialized: table
    +contract:
      enforced: true
      alias_types: false      # native DuckDB types; no adapter remapping
    +persist_docs:
      relation: true
      columns: true
    +group: er_core
    +access: private

    # Only layers that CURRENTLY contain models are configured. `error: all`
    # turns dbt's "unused configuration paths" warning into a build failure, so a
    # block for a directory that does not exist yet is itself an error. Add each
    # layer's block in the same commit as its first model.
    intermediate:
      +tags: ["parity"]

# NOTE: the data_tests: block is NOT here. C.1 delta 11 moves it to
# integration_tests/dbt_project.yml -- store_failures_as: table in a PACKAGE
# materialises 500 rows of person data into every consumer's warehouse (12.5,
# 3.52).

# Travels WITH the package, so it also protects consumers -- whose root project
# can override our model configs. This is the only gate that reaches their build
# (section 2). Its hardening values live in er_hardening(), not in `vars:`,
# precisely so that root configuration cannot reach them (section 2.1).
on-run-start:
  - "{{ dbt_er.er_assert_project_standards() }}"
